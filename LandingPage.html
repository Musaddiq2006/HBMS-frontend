<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaMu Hospital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0D10;
    --surface: #15181C;
    --surface-hover: #1A1E23;
    --ink: #ECEDEF;
    --ink-soft: #A7AEB6;
    --ink-faint: #676E76;
    --line: #24282E;
    --line-strong: #33383F;
    --accent: #4FAE97;
    --accent-tint: rgba(79,174,151,.14);
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 30px 60px -30px rgba(0,0,0,.65);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --ease: cubic-bezier(.16,.8,.3,1);
  }
  :root[data-theme="light"]{
    --bg: #FAFAFA;
    --surface: #FFFFFF;
    --surface-hover: #F4F5F4;
    --ink: #111318;
    --ink-soft: #5C6370;
    --ink-faint: #9AA1AC;
    --line: #E7E8EC;
    --line-strong: #D8DADF;
    --accent: #1C4F45;
    --accent-tint: #E9F1EE;
    --shadow: 0 1px 2px rgba(17,19,24,.04), 0 20px 40px -24px rgba(17,19,24,.16);
  }
  body{ transition: background .35s var(--ease), color .35s var(--ease); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important;} }
  button{ font-family:inherit; cursor:pointer; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  .stage{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:64px 24px; position:relative; overflow:hidden;
  }
  .stage::before{
    content:''; position:absolute; inset:0;
    background: radial-gradient(600px 320px at 20% 0%, rgba(79,174,151,.09), transparent 60%),
                radial-gradient(500px 300px at 90% 100%, rgba(79,174,151,.06), transparent 60%);
    pointer-events:none;
  }

  .stage-inner{ max-width:900px; width:100%; position:relative; }

  /* cool design heartbeat */
  .pulse-wrap{ display:flex; justify-content:center; margin-bottom:28px; opacity:.85; }
  .pulse-line{ width:220px; height:36px; }
  .pulse-line path{
    fill:none; stroke:var(--accent); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:340; stroke-dashoffset:340;
    animation: draw 1.6s var(--ease) .2s forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .lockup{ text-align:center; margin-bottom:56px; opacity:0; animation:rise .7s var(--ease) .1s forwards; }
  .lockup .eyebrow{
    font-family:var(--font-body); font-size:11px; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-faint); margin-bottom:14px;
  }
  .lockup h1{
    font-family:var(--font-display); font-weight:500; font-size:clamp(34px,5vw,52px);
    letter-spacing:-.01em; margin:0 0 12px; color:var(--ink);
  }
  .lockup p{ margin:0; color:var(--ink-soft); font-size:15.5px; }

  .cards{
    display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line);
    border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow);
    opacity:0; animation:rise .7s var(--ease) .3s forwards;
  }
  @media (max-width:640px){ .cards{ grid-template-columns:1fr; } }

  @keyframes rise{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }

  .portal-card{
    background:var(--surface); border:none; text-align:left; padding:40px 34px;
    display:flex; flex-direction:column; gap:18px; position:relative;
    transition:background .35s var(--ease);
  }
  .portal-card:hover{ background:var(--surface-hover); }
  .portal-card:hover .icon-ring{ border-color:var(--accent); background:var(--accent-tint); }
  .portal-card:hover .go-arrow{ transform:translateX(4px); }
  .portal-card:hover .go-arrow svg{ stroke:var(--accent); }

  .icon-ring{
    width:46px; height:46px; border-radius:50%; border:1px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center; transition:border-color .3s var(--ease), background .3s var(--ease);
  }
  .icon-ring svg{ width:20px; height:20px; stroke:var(--ink); }

  .portal-card h3{
    font-family:var(--font-display); font-weight:500; font-size:19px; margin:0; letter-spacing:-.005em;
    color:var(--ink);
  }
  .portal-card p{ margin:0; color:var(--ink-soft); font-size:13.5px; line-height:1.6; }

  .go-arrow{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600;
    color:var(--ink); margin-top:auto; padding-top:6px; transition:transform .3s var(--ease);
  }
  .go-arrow svg{ width:14px; height:14px; stroke:var(--ink-faint); transition:stroke .3s var(--ease); }

  .foot-note{
    text-align:center; margin-top:32px; font-size:12px; color:var(--ink-faint);
    opacity:0; animation:rise .7s var(--ease) .5s forwards;
  }

  .theme-toggle{
    position:fixed; top:22px; right:22px; width:38px; height:38px; border-radius:50%;
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
    display:flex; align-items:center; justify-content:center; z-index:50;
    transition:border-color .3s var(--ease), background .3s var(--ease);
  }
  .theme-toggle:hover{ border-color:var(--accent); background:var(--accent-tint); }
  .theme-toggle svg{ width:17px; height:17px; stroke:var(--ink); }
  .theme-toggle .icon-sun{ display:none; }
  :root[data-theme="light"] .theme-toggle .icon-moon{ display:none; }
  :root[data-theme="light"] .theme-toggle .icon-sun{ display:block; }
</style>
</head>
<body>

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark theme">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/>
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
    </svg>
  </button>

  <div class="stage">
    <div class="stage-inner">

      <div class="pulse-wrap">
        <svg class="pulse-line" viewBox="0 0 220 36" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 18 H70 L82 4 L96 32 L108 18 H140 L150 26 L160 10 L168 18 H220"/>
        </svg>
      </div>

      <div class="lockup">
        <div class="eyebrow">Ward &amp; Capacity System</div>
        <h1>LaMu Hospital</h1>
        <p>Choose a portal to continue</p>
      </div>

      <div class="cards">
        <button class="portal-card" onclick="window.location.href='PublicLogin.html'">
          <div class="icon-ring">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 21V9l8-5 8 5v12"/><path d="M9 21v-6h6v6"/><path d="M12 4v5M9.5 6.5h5"/>
            </svg>
          </div>
          <h3>Public Portal</h3>
          <p>Information available for the viewing of the general public.</p>
          <span class="go-arrow">Continue as visitor
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </button>

        <button class="portal-card" onclick="window.location.href='StaffLogin.html'">
          <div class="icon-ring">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
          </div>
          <h3>Staff &amp; Functionary Login</h3>
          <p>For the staff of the LaMu hospital.</p>
          <span class="go-arrow">Sign in
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </button>
      </div>

      <div class="foot-note">LaMu Hospital · Internal ward management system</div>
    </div>
  </div>
  <script>
    
    const root = document.documentElement;
    const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    root.setAttribute('data-theme', prefersLight ? 'light' : 'dark');

    document.getElementById('themeToggle').addEventListener('click', () => {
      const current = root.getAttribute('data-theme');
      root.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    });
  </script>

</body>
</html>
