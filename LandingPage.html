<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaMu Hospital — Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F7F6;
    --surface: #FFFFFF;
    --ink: #16262A;
    --ink-soft: #4B5F63;
    --primary: #0D5C63;
    --primary-tint: #E3EFEE;
    --primary-dark: #08403F;
    --accent-tint: #FBEEDC;
    --line: #DFE6E4;
    --shadow: 0 1px 2px rgba(10,30,30,.06), 0 8px 24px -12px rgba(10,30,30,.12);
    --font-display: 'IBM Plex Sans', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-display);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;} }
  :focus-visible{outline:2px solid var(--primary); outline-offset:2px;}

  .gate{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px;
    background:
      radial-gradient(circle at 15% 20%, rgba(13,92,99,.07), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(217,142,59,.08), transparent 40%),
      var(--bg);
  }
  .gate-inner{max-width:880px; width:100%;}
  .gate-header{text-align:center; margin-bottom:36px;}
  .brand-mark{
    width:52px; height:52px; border-radius:12px; background:var(--primary);
    display:flex; align-items:center; justify-content:center; color:#fff;
    font-size:22px; font-weight:700; margin:0 auto 14px;
  }
  .gate-header h1{font-size:28px; margin:0 0 6px; letter-spacing:-0.01em;}
  .gate-header p{color:var(--ink-soft); margin:0; font-size:14.5px;}

  .gate-cards{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media (max-width:640px){ .gate-cards{grid-template-columns:1fr;} }

  .gate-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:26px 24px; text-align:left; cursor:pointer;
    transition:transform .15s, box-shadow .15s, border-color .15s;
    display:block; width:100%; font:inherit; color:inherit;
  }
  .gate-card:hover{transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--primary);}

  .gate-card .icon{
    width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:20px; margin-bottom:16px;
  }
  .gate-card.public .icon{background:var(--primary-tint); color:var(--primary-dark);}
  .gate-card.staff .icon{background:var(--accent-tint); color:#8A5A1E;}

  .gate-card h3{margin:0 0 6px; font-size:17px;}
  .gate-card p{margin:0 0 14px; color:var(--ink-soft); font-size:13.5px;}
  .gate-card .enter-cta{font-size:13px; font-weight:600; color:var(--primary); display:flex; align-items:center; gap:6px;}
</style>
</head>
<body>

  <div class="gate">
    <div class="gate-inner">
      <div class="gate-header">
        <div class="brand-mark">LM</div>
        <h1>LaMu Hospital</h1>
        <p>Choose a portal to continue</p>
      </div>
      <div class="gate-cards">
        <button class="gate-card public" onclick="window.location.href='PublicLogin.html'">
          <div class="icon">🏥</div>
          <h3>Public Portal</h3>
          <p>Check bed availability,Doctor availability,Projected vacancies.</p>
          <div class="enter-cta">Continue as visitor →</div>
        </button>
        <button class="gate-card staff" onclick="window.location.href='StaffLogin.html'">
          <div class="icon">🔒</div>
          <h3>Staff &amp; Functionary Login</h3>
          <p>For registered staff of the LaMu Hospital.</p>
          <div class="enter-cta">Sign in →</div>
        </button>
      </div>
    </div>
  </div>

</body>
</html>
