<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaMu Hospital — Public Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F7F6;
    --surface: #FFFFFF;
    --surface-2: #EEF2F1;
    --ink: #16262A;
    --ink-soft: #4B5F63;
    --ink-faint: #7C8D90;
    --primary: #0D5C63;
    --primary-dark: #08403F;
    --primary-tint: #E3EFEE;
    --accent: #D98E3B;
    --accent-tint: #FBEEDC;
    --success: #3E8E5A;
    --success-tint: #E4F3E8;
    --warning: #D98E3B;
    --danger: #C1443B;
    --line: #DFE6E4;
    --shadow: 0 1px 2px rgba(10,30,30,.06), 0 8px 24px -12px rgba(10,30,30,.12);
    --font-display: 'IBM Plex Sans', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-display);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;} }
  button{ font-family:inherit; font-size:inherit; color:inherit; cursor:pointer; }
  :focus-visible{outline:2px solid var(--primary); outline-offset:2px;}

  .wrap{max-width:1080px; margin:0 auto; padding:0 20px;}

  /* Top bar */
  .topbar{ background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  .topbar-inner{
    max-width:1080px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; letter-spacing:-0.01em;}
  .brand-mark{
    width:34px; height:34px; border-radius:8px; background:var(--primary);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; font-weight:700; flex-shrink:0;
  }
  .brand-sub{font-size:11px; font-weight:500; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; margin-top:-2px;}
  .topbar-right{display:flex; align-items:center; gap:12px;}
  .role-badge{
    font-family:var(--font-mono); font-size:11.5px; font-weight:600; letter-spacing:.03em;
    padding:5px 10px; border-radius:999px; text-transform:uppercase;
    background:var(--primary-tint); color:var(--primary-dark);
  }
  .btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:9px 16px; border-radius:8px; font-weight:600; font-size:13.5px;
    transition:border-color .15s, background .15s; text-decoration:none; display:inline-block;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn-sm{padding:6px 12px; font-size:12.5px;}

  /* Main */
  .main{flex:1; padding:28px 0 60px;}
  .section{margin-bottom:34px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
  .section-head h2{font-size:17px; margin:0; letter-spacing:-0.01em;}
  .section-head .section-sub{font-size:12.5px; color:var(--ink-faint);}

  /* Ward cards */
  .ward-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px; margin-bottom:16px;}
  .ward-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 16px 14px;}
  .ward-card .ward-name{font-weight:700; font-size:14.5px; margin-bottom:2px;}
  .ward-card .ward-dept{font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:12px;}
  .bedbar{display:flex; gap:2px; margin-bottom:8px;}
  .bedbar .pip{flex:1; height:9px; border-radius:2px; background:var(--surface-2); border:1px solid var(--line);}
  .bedbar .pip.filled{background:var(--primary); border-color:var(--primary);}
  .ward-stats{display:flex; align-items:baseline; justify-content:space-between;}
  .ward-stats .free{font-family:var(--font-mono); font-weight:700; font-size:13px;}
  .ward-stats .free.ok{color:var(--success);}
  .ward-stats .free.low{color:var(--warning);}
  .ward-stats .free.full{color:var(--danger);}
  .ward-stats .total{font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono);}

  /* Date scroller */
  .date-scroller{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:16px; -webkit-overflow-scrolling:touch;}
  .date-scroller::-webkit-scrollbar{height:5px;}
  .date-scroller::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  .date-pill{
    flex:0 0 auto; min-width:58px; padding:9px 6px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); text-align:center; transition:border-color .15s, background .15s;
  }
  .date-pill .dow{display:block; font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; margin-bottom:3px;}
  .date-pill .dnum{display:block; font-weight:700; font-size:15px; font-family:var(--font-mono);}
  .date-pill.active{background:var(--primary); border-color:var(--primary);}
  .date-pill.active .dow, .date-pill.active .dnum{color:#fff;}
  .projection-flag{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    background:var(--accent-tint); color:#8A5A1E; padding:6px 12px; border-radius:999px; margin-bottom:14px;
  }
  .projection-flag .dot{width:6px; height:6px; border-radius:50%; background:var(--accent);}

  /* Table */
  .table-wrap{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:auto;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; padding:11px 14px; background:var(--surface-2); font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); font-weight:600; white-space:nowrap;}
  td{padding:11px 14px; border-top:1px solid var(--line); white-space:nowrap;}
  tr:hover td{background:var(--surface-2);}

  /* Doctor grid */
  .doctor-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px;}
  .doctor-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px;}
  .doctor-card .dtop{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .doc-avatar{width:38px; height:38px; border-radius:50%; background:var(--primary-tint); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
  .doctor-card .dname{font-weight:700; font-size:14px;}
  .doctor-card .dspec{font-size:12px; color:var(--ink-faint);}
  .avail-tag{font-size:11px; font-weight:600; padding:4px 9px; border-radius:999px; display:inline-flex; align-items:center; gap:5px;}
  .avail-tag.yes{background:var(--success-tint); color:var(--success);}
  .avail-tag.no{background:var(--surface-2); color:var(--ink-faint);}
  .avail-tag .dot{width:6px; height:6px; border-radius:50%;}
  .avail-tag.yes .dot{background:var(--success);}
  .avail-tag.no .dot{background:var(--ink-faint);}

  footer{border-top:1px solid var(--line); padding:18px 0; text-align:center; font-size:12px; color:var(--ink-faint);}
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">LM</div>
        <div>
          LaMu Hospital
          <div class="brand-sub">Public Patient Portal</div>
        </div>
      </div>
      <div class="topbar-right">
        <span class="role-badge">Public</span>
        <a class="btn btn-sm" href="LandingPage.html">← Back to home</a>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="wrap">

      <div class="section">
        <div class="section-head">
          <h2>Ward Bed Availability</h2>
          <span class="section-sub" id="modeLabel">Live count</span>
        </div>

        <div class="date-scroller" id="dateScroller"></div>
        <div id="projectionFlag"></div>

        <div class="ward-grid" id="wardCards"></div>

        <div class="table-wrap">
          <table>
            <thead><tr><th>Ward</th><th>Total beds</th><th>Occupied</th><th>Vacant</th></tr></thead>
            <tbody id="wardRows"></tbody>
          </table>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <h2>Available Doctors</h2>
          <span class="section-sub" id="doctorSummary"></span>
        </div>
        <div class="doctor-grid" id="doctorCards"></div>
      </div>

    </div>
  </div>

  <footer>LaMu Hospital · Public information portal · Figures update periodically</footer>

<script>
  /* ===== Static demo data — replace with data fetched from the backend ===== */
  const WARDS = [
    { id:'w1', name:'General Medicine', dept:'Internal Medicine', total:40, occupied:27 },
    { id:'w2', name:'Orthopedics',      dept:'Musculoskeletal',   total:20, occupied:14 },
    { id:'w3', name:'Pediatrics',       dept:'Child Health',      total:25, occupied:16 },
    { id:'w4', name:'Cardiology',       dept:'Heart & Vascular',  total:18, occupied:15 },
    { id:'w5', name:'ICU',              dept:'Critical Care',     total:12, occupied:10 },
    { id:'w6', name:'Maternity',        dept:'Obstetrics',        total:22, occupied:12 },
    { id:'w7', name:'Emergency Obs.',   dept:'Emergency',         total:15, occupied:9  },
  ];

  const DOCTORS = [
    { id:'d1', name:'Dr. Ismail Khan',   specialty:'General Medicine',   wardId:'w1', availableToday:true  },
    { id:'d2', name:'Dr. Rayan Syed', specialty:'Orthopedics',        wardId:'w2', availableToday:true  },
    { id:'d3', name:'Dr. Sara Iyer',    specialty:'Pediatrics',         wardId:'w3', availableToday:true  },
    { id:'d4', name:'Dr. Ikram Mohammed', specialty:'Cardiology',         wardId:'w4', availableToday:false },
    { id:'d5', name:'Dr. Priya Sharma',   specialty:'Critical Care',      wardId:'w5', availableToday:true  },
    { id:'d6', name:'Dr. Farah Sheikh', specialty:'Obstetrics',         wardId:'w6', availableToday:true  },
    { id:'d7', name:'Dr. Harsh Kumar',    specialty:'Emergency Medicine', wardId:'w7', availableToday:true  },
  ];

  let dateOffset = 0; // 0 = today / live

  /* ===== Helpers ===== */
  function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
  function wardById(id){ return WARDS.find(w => w.id === id); }

  function seededDelta(seed){
    const x = Math.sin(seed) * 10000;
    const frac = x - Math.floor(x);
    return Math.floor(frac * 7) - 3; // -3..3
  }
  function projectedOccupied(ward, offsetDays){
    if(offsetDays === 0) return ward.occupied;
    const seed = (ward.id.charCodeAt(1) * 97) + offsetDays * 13.7;
    const drift = seededDelta(seed) + (offsetDays > 5 ? -1 : 0);
    return clamp(ward.occupied + drift, 0, ward.total);
  }
  function fmtDate(d){ return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short' }); }
  function dowLabel(d){ return d.toLocaleDateString('en-IN', { weekday:'short' }); }
  function next14Days(){
    const arr = [];
    for(let i=0;i<14;i++){ const d = new Date(); d.setDate(d.getDate()+i); arr.push(d); }
    return arr;
  }
  function freeClass(free, total){
    const ratio = free/total;
    if(free === 0) return 'full';
    if(ratio < 0.15) return 'low';
    return 'ok';
  }
  function initials(name){
    return name.replace('Dr. ','').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  }

  /* ===== Render ===== */
  function render(){
    const dates = next14Days();
    const offset = dateOffset;
    const isLive = offset === 0;

    document.getElementById('modeLabel').textContent = isLive ? 'Live count' : 'Projected estimate — for planning only';

    // Date scroller
    document.getElementById('dateScroller').innerHTML = dates.map((d,i)=>`
      <button class="date-pill ${i===offset?'active':''}" data-offset="${i}">
        <span class="dow">${dowLabel(d)}</span>
        <span class="dnum">${fmtDate(d)}</span>
      </button>
    `).join('');

    // Projection flag
    document.getElementById('projectionFlag').innerHTML = !isLive
      ? `<div class="projection-flag"><span class="dot"></span>Showing projected vacancies for ${fmtDate(dates[offset])} — estimates may change</div>`
      : '';

    // Ward cards
    document.getElementById('wardCards').innerHTML = WARDS.map(w=>{
      const occ = isLive ? w.occupied : projectedOccupied(w, offset);
      const free = w.total - occ;
      const pipCount = Math.min(w.total, 20);
      const bedsPerPip = w.total / pipCount;
      const filledPips = Math.round(occ / bedsPerPip);
      let pips = '';
      for(let i=0;i<pipCount;i++){ pips += `<div class="pip ${i < filledPips ? 'filled' : ''}"></div>`; }
      return `
      <div class="ward-card">
        <div class="ward-name">${w.name}</div>
        <div class="ward-dept">${w.dept}</div>
        <div class="bedbar">${pips}</div>
        <div class="ward-stats">
          <span class="free ${freeClass(free,w.total)}">${free} free</span>
          <span class="total">${occ}/${w.total} beds</span>
        </div>
      </div>`;
    }).join('');

    // Ward table
    document.getElementById('wardRows').innerHTML = WARDS.map(w=>{
      const occ = isLive ? w.occupied : projectedOccupied(w, offset);
      const free = w.total - occ;
      return `<tr>
        <td><strong>${w.name}</strong><div style="font-size:11px;color:var(--ink-faint)">${w.dept}</div></td>
        <td style="font-family:var(--font-mono)">${w.total}</td>
        <td style="font-family:var(--font-mono)">${occ}</td>
        <td><span class="free ${freeClass(free,w.total)}" style="font-family:var(--font-mono);font-weight:700">${free}</span></td>
      </tr>`;
    }).join('');

    // Doctors
    document.getElementById('doctorSummary').textContent =
      `${DOCTORS.filter(d=>d.availableToday).length} of ${DOCTORS.length} on-site today`;

    document.getElementById('doctorCards').innerHTML = DOCTORS.map(d=>{
      const w = wardById(d.wardId);
      return `
      <div class="doctor-card">
        <div class="dtop">
          <div class="doc-avatar">${initials(d.name)}</div>
          <div>
            <div class="dname">${d.name}</div>
            <div class="dspec">${d.specialty}</div>
          </div>
        </div>
        <div style="font-size:11.5px;color:var(--ink-faint);margin-bottom:10px">${w.name}</div>
        <span class="avail-tag ${d.availableToday?'yes':'no'}"><span class="dot"></span>${d.availableToday?'Available today':'Not available today'}</span>
      </div>`;
    }).join('');
  }

  document.addEventListener('click', (e)=>{
    const pill = e.target.closest('.date-pill');
    if(!pill) return;
    dateOffset = parseInt(pill.dataset.offset, 10);
    render();
  });

  render();
</script>

</body>
</html>
