<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaMu Hospital — Doctors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0D10;
    --surface: #15181C;
    --surface-hover: #1A1E23;
    --ink: #ECEDEF;
    --ink-soft: #A7AEB6;
    --ink-faint: #676E76;
    --line: #24282E;
    --line-strong: #33383F;
    --accent: #4FAE97;
    --accent-tint: rgba(79,174,151,.14);
    --success: #5CBE93;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --ease: cubic-bezier(.16,.8,.3,1);
  }
  :root[data-theme="light"]{
    --bg: #FAFAFA;
    --surface: #FFFFFF;
    --surface-hover: #F4F5F4;
    --ink: #111318;
    --ink-soft: #5C6370;
    --ink-faint: #9AA1AC;
    --line: #E7E8EC;
    --line-strong: #D8DADF;
    --accent: #1C4F45;
    --accent-tint: #E9F1EE;
    --success: #2E7D5B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.6;
    -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column;
    transition:background .35s var(--ease), color .35s var(--ease);
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important;} }
  button{ font-family:inherit; cursor:pointer; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .wrap{max-width:960px; margin:0 auto; padding:0 24px;}

  .topbar{ background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
  .topbar-inner{
    max-width:960px; margin:0 auto; padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:11px;}
  .brand-mark{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display);
    font-size:13px; font-weight:600; flex-shrink:0;
  }
  .brand-name{ font-family:var(--font-display); font-weight:500; font-size:16px; letter-spacing:-.005em; }

  .tabs{display:flex; gap:22px;}
  .tab{ font-size:13.5px; font-weight:500; color:var(--ink-faint); text-decoration:none; padding:6px 0; position:relative; }
  .tab::after{
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:1.5px; background:var(--accent);
    transform:scaleX(0); transition:transform .25s var(--ease); transform-origin:left;
  }
  .tab:hover{ color:var(--ink); }
  .tab.active{ color:var(--ink); }
  .tab.active::after{ transform:scaleX(1); }

  .topbar-right{display:flex; align-items:center; gap:10px;}
  .btn{
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
    padding:8px 15px; border-radius:8px; font-weight:600; font-size:13px;
    transition:border-color .2s var(--ease), background .2s var(--ease); text-decoration:none; display:inline-block;
  }
  .btn:hover{ border-color:var(--accent); background:var(--accent-tint); }
  .icon-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line-strong); background:var(--surface);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:border-color .2s var(--ease), background .2s var(--ease);
  }
  .icon-btn:hover{ border-color:var(--accent); background:var(--accent-tint); }
  .icon-btn svg{ width:15px; height:15px; stroke:var(--ink); }
  .icon-btn .icon-sun{ display:none; }
  :root[data-theme="light"] .icon-btn .icon-moon{ display:none; }
  :root[data-theme="light"] .icon-btn .icon-sun{ display:block; }

  .main{flex:1; padding:56px 0 72px;}
  .page-head{ margin-bottom:40px; }
  .page-head .eyebrow{
    font-family:var(--font-mono); font-size:11px; font-weight:500; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:10px;
  }
  .page-head h1{
    font-family:var(--font-display); font-weight:500; font-size:clamp(26px,3.4vw,34px);
    letter-spacing:-.01em; margin:0 0 8px;
  }
  .page-head p{ margin:0; color:var(--ink-soft); font-size:14.5px; max-width:46ch; }

  .doctor-list{ display:flex; flex-direction:column; }
  .doctor-item{
    border-bottom:1px solid var(--line);
    opacity:0; transform:translateY(10px); transition:opacity .5s var(--ease), transform .5s var(--ease);
  }
  .doctor-item.in-view{ opacity:1; transform:translateY(0); }
  .doctor-item:first-child{ border-top:1px solid var(--line); }

  .doctor-row{
    display:flex; align-items:center; gap:18px; padding:20px 4px; width:100%; background:none; border:none;
    text-align:left; color:inherit; transition:background .2s var(--ease);
  }
  .doctor-row:hover{ background:var(--surface-hover); }

  .doc-avatar{
    width:44px; height:44px; border-radius:50%; background:var(--accent-tint); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600;
    font-size:15px; flex-shrink:0;
  }
  .doc-info{ flex:1; min-width:0; }
  .doc-name{ font-family:var(--font-display); font-weight:500; font-size:15.5px; }
  .doc-meta{ font-size:12.5px; color:var(--ink-faint); margin-top:1px; }
  .doc-status{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:500; flex-shrink:0; white-space:nowrap; }
  .doc-status .dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .doc-status.yes{ color:var(--success); } .doc-status.yes .dot{ background:var(--success); }
  .doc-status.no{ color:var(--ink-faint); } .doc-status.no .dot{ background:var(--ink-faint); }

  .chevron{ width:15px; height:15px; stroke:var(--ink-faint); flex-shrink:0; transition:transform .35s var(--ease); }
  .doctor-row[aria-expanded="true"] .chevron{ transform:rotate(90deg); stroke:var(--ink); }

  .detail-wrap{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .4s var(--ease); }
  .detail-wrap.open{ grid-template-rows:1fr; }
  .detail-inner{ overflow:hidden; }
  .detail-body{
    padding:2px 4px 26px 62px; display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:16px 24px;
  }
  .detail-field .dl{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin-bottom:4px;
  }
  .detail-field .dv{ font-size:13.5px; }
  .detail-bio{
    grid-column:1/-1; font-size:13.5px; color:var(--ink-soft); line-height:1.65; padding-top:2px;
    border-top:1px solid var(--line); margin-top:2px; padding-top:14px;
  }

  footer{border-top:1px solid var(--line); padding:22px 0; text-align:center; font-size:11.5px; color:var(--ink-faint);}
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">LM</div>
        <div class="brand-name">LaMu Hospital</div>
      </div>
      <div class="tabs">
        <a class="tab" href="PublicDashboard.html">Wards</a>
        <a class="tab active" href="PublicLogin.html">Doctors</a>
      </div>
      <div class="topbar-right">
        <a class="btn" href="LandingPage.html">Back to home</a>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle light and dark theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="wrap">
      <div class="page-head">
        <div class="eyebrow">On Duty</div>
        <h1>Doctors</h1>
        <p>Specialists currently attached to LaMu Hospital. Select a name for qualifications and consulting hours.</p>
      </div>

      <div class="doctor-list" id="doctorList"></div>
    </div>
  </div>

  <footer>LaMu Hospital · Public information portal · Figures update periodically</footer>

<script>
  const root = document.documentElement;
  const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  root.setAttribute('data-theme', prefersLight ? 'light' : 'dark');
  document.getElementById('themeToggle').addEventListener('click', () => {
    root.setAttribute('data-theme', root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ===== Static demo data — replace with data fetched from the backend ===== */
  const WARDS = [
    { id:'w1', name:'General Medicine' }, { id:'w2', name:'Orthopedics' }, { id:'w3', name:'Pediatrics' },
    { id:'w4', name:'Cardiology' }, { id:'w5', name:'ICU' }, { id:'w6', name:'Maternity' }, { id:'w7', name:'Emergency Obs.' },
  ];

  const DOCTORS = [
    {
      id:'d1', name:'Dr. Ismail Khan', specialty:'General Medicine', wardId:'w1', availableToday:true,
      qualification:'MBBS, MD (General Medicine)', experience:'12 years', languages:'English, Hindi, Urdu',
      hours:'Mon–Fri · 9:00 AM – 4:00 PM',
      bio:'Focuses on general adult care, chronic disease management, and preventive health screening.'
    },
    {
      id:'d2', name:'Dr. Rayan Syed', specialty:'Orthopedics', wardId:'w2', availableToday:true,
      qualification:'MBBS, MS (Orthopedics)', experience:'9 years', languages:'English, Hindi',
      hours:'Mon, Wed, Fri · 10:00 AM – 5:00 PM',
      bio:'Specialises in joint and fracture care, with a particular interest in sports-related injuries.'
    },
    {
      id:'d3', name:'Dr. Sara Iyer', specialty:'Pediatrics', wardId:'w3', availableToday:true,
      qualification:'MBBS, MD (Pediatrics)', experience:'8 years', languages:'English, Hindi, Tamil',
      hours:'Mon–Sat · 9:00 AM – 1:00 PM',
      bio:'Provides care for infants through adolescents, including routine immunisation and growth monitoring.'
    },
    {
      id:'d4', name:'Dr. Ikram Mohammed', specialty:'Cardiology', wardId:'w4', availableToday:false,
      qualification:'MBBS, MD, DM (Cardiology)', experience:'15 years', languages:'English, Hindi, Urdu',
      hours:'Tue, Thu · 11:00 AM – 6:00 PM',
      bio:'Manages coronary artery disease, arrhythmia, and post-cardiac event recovery planning.'
    },
    {
      id:'d5', name:'Dr. Priya Sharma', specialty:'Critical Care', wardId:'w5', availableToday:true,
      qualification:'MBBS, MD, Fellowship in Critical Care', experience:'11 years', languages:'English, Hindi',
      hours:'On call · 24 hours',
      bio:'Oversees intensive care patients, coordinating with specialists across departments as needed.'
    },
    {
      id:'d6', name:'Dr. Farah Sheikh', specialty:'Obstetrics', wardId:'w6', availableToday:true,
      qualification:'MBBS, MD (Obstetrics & Gynaecology)', experience:'10 years', languages:'English, Hindi, Urdu',
      hours:'Mon–Fri · 9:00 AM – 3:00 PM',
      bio:'Supports antenatal care, delivery, and postnatal recovery for mother and newborn.'
    },
    {
      id:'d7', name:'Dr. Harsh Kumar', specialty:'Emergency Medicine', wardId:'w7', availableToday:true,
      qualification:'MBBS, MD (Emergency Medicine)', experience:'7 years', languages:'English, Hindi',
      hours:'Rotating shifts · 24 hours',
      bio:'First point of contact for acute and trauma cases arriving at the emergency department.'
    },
  ];

  function wardById(id){ return WARDS.find(w => w.id === id); }
  function initials(name){ return name.replace('Dr. ','').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

  document.getElementById('doctorList').innerHTML = DOCTORS.map(d=>{
    const w = wardById(d.wardId);
    return `
    <div class="doctor-item">
      <button class="doctor-row" data-toggle="${d.id}" aria-expanded="false" aria-controls="detail-${d.id}">
        <div class="doc-avatar">${initials(d.name)}</div>
        <div class="doc-info">
          <div class="doc-name">${d.name}</div>
          <div class="doc-meta">${d.specialty} · ${w.name}</div>
        </div>
        <div class="doc-status ${d.availableToday?'yes':'no'}">
          <span class="dot"></span>${d.availableToday ? 'Available today' : 'Not available'}
        </div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="detail-wrap" id="detail-${d.id}">
        <div class="detail-inner">
          <div class="detail-body">
            <div class="detail-field"><div class="dl">Qualification</div><div class="dv">${d.qualification}</div></div>
            <div class="detail-field"><div class="dl">Experience</div><div class="dv">${d.experience}</div></div>
            <div class="detail-field"><div class="dl">Languages</div><div class="dv">${d.languages}</div></div>
            <div class="detail-field"><div class="dl">Consulting hours</div><div class="dv">${d.hours}</div></div>
            <div class="detail-bio">${d.bio}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('doctorList').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-toggle]');
    if(!btn) return;
    const wrap = document.getElementById('detail-' + btn.dataset.toggle);
    const isOpen = wrap.classList.toggle('open');
    btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });

  const items = document.querySelectorAll('.doctor-item');
  if(reduceMotion){ items.forEach(r => r.classList.add('in-view')); }
  else{
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if(entry.isIntersecting){
          setTimeout(() => entry.target.classList.add('in-view'), i * 55);
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    items.forEach(r => io.observe(r));
  }
</script>

</body>
</html>
